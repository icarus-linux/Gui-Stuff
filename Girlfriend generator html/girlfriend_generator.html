<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girlfriend Generator 3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #1F1329;
    --bg-panel: #2C1B3D;
    --pink: #FF5C8A;
    --gold: #F4C15C;
    --lavender: #B8A3D6;
    --cream: #FBF1E6;
    --green-ok: #6FCF97;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,92,138,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(244,193,92,0.14), transparent 50%),
      var(--bg-deep);
    color: var(--cream);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .machine {
    width: 100%;
    max-width: 460px;
    background: var(--bg-panel);
    border-radius: 28px;
    border: 3px solid #4A2F63;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 0 0 6px rgba(255,255,255,0.02);
    padding: 28px 26px 24px;
    position: relative;
    overflow: hidden;
  }

  .machine::before {
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,92,138,0.35), transparent 70%);
    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .brand h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    margin: 0;
    color: var(--gold);
    letter-spacing: 0.2px;
  }

  .brand .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green-ok);
    box-shadow: 0 0 8px var(--green-ok);
    flex-shrink: 0;
  }

  .screen {
    background: #150C1E;
    border-radius: 18px;
    padding: 22px 20px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid #3A2650;
    position: relative;
  }

  .progress-track {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .progress-track span {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #3A2650;
    transition: background 0.3s ease;
  }
  .progress-track span.done { background: var(--pink); }

  .q-label {
    font-size: 0.8rem;
    color: var(--lavender);
    margin-bottom: 8px;
  }

  .q-text {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    line-height: 1.35;
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt-btn {
    background: #241531;
    border: 2px solid #3A2650;
    color: var(--cream);
    padding: 13px 16px;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.98rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .opt-btn:hover { border-color: var(--pink); background: #2C1B3D; }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .intro {
    text-align: center;
  }
  .intro .big-emoji { font-size: 2.6rem; margin-bottom: 10px; }
  .intro h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.35rem;
    margin: 0 0 10px;
    color: var(--gold);
  }
  .intro p {
    color: var(--lavender);
    font-size: 0.95rem;
    line-height: 1.5;
    margin: 0 0 22px;
  }

  .start-btn, .again-btn {
    background: var(--pink);
    color: #1F1329;
    border: none;
    padding: 14px 22px;
    border-radius: 14px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .start-btn:hover, .again-btn:hover { background: #ff77a0; }
  .start-btn:active, .again-btn:active { transform: scale(0.97); }

  /* loading */
  .loading-wrap {
    text-align: center;
  }
  .loading-wrap .lw-label {
    font-size: 0.95rem;
    color: var(--lavender);
    margin-bottom: 18px;
    min-height: 1.3em;
  }
  .bar-outer {
    width: 100%;
    height: 14px;
    background: #241531;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #3A2650;
  }
  .bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--gold));
    border-radius: 8px;
    transition: width 0.2s linear;
  }
  .bar-pct {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--lavender);
  }

  /* result: roast */
  .roast {
    text-align: center;
  }
  .roast .big-emoji { font-size: 3rem; margin-bottom: 14px; }
  .roast h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.4rem;
    color: var(--pink);
    margin: 0 0 10px;
    line-height: 1.35;
  }
  .roast p {
    color: var(--lavender);
    font-size: 0.92rem;
    margin: 0 0 22px;
  }

  /* result: photo card */
  .result-card {
    text-align: center;
  }
  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }
  .avatar-wrap img {
    max-width: 100%;
    max-height: 280px;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 16px;
    background: #241531;
    border: 3px solid var(--gold);
    padding: 6px;
  }
  .result-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--gold);
    margin: 0 0 4px;
  }
  .result-tag {
    color: var(--lavender);
    font-size: 0.85rem;
    margin: 0 0 12px;
  }
  .result-bio {
    background: #241531;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.92rem;
    line-height: 1.45;
    margin: 0 0 22px;
    border: 1px solid #3A2650;
  }

  .match-badge {
    display: inline-block;
    background: rgba(111,207,151,0.15);
    color: var(--green-ok);
    border: 1px solid rgba(111,207,151,0.4);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    margin-bottom: 14px;
  }

  .footer-note {
    text-align: center;
    color: #6B5A82;
    font-size: 0.72rem;
    margin-top: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-inner, .opt-btn, .start-btn, .again-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="machine">
  <div class="brand">
    <h1>Girlfriend Generator 3000</h1>
    <div class="dot" title="Online"></div>
  </div>

  <div class="screen" id="screen">
    <!-- content injected by JS -->
  </div>

  <div class="footer-note">100% scientific. 0% accurate.</div>
</div>

<script>
(function(){
  const screen = document.getElementById('screen');

  const questions = [
    {
      label: "QUESTION 1 OF 5",
      text: "What are you actually looking for in a partner?",
      options: ["Someone who laughs at my bad jokes", "Someone who can steal my food guilt-free", "Emotional stability", "Honestly I just want wifi"]
    },
    {
      label: "QUESTION 2 OF 5",
      text: "Ideal first date?",
      options: ["Fireside chat till 2AM", "Movie, popcorn, minimal talking", "Dinner where she doesn't look at the prices", "A walk that conveniently ends at a food stall"]
    },
    {
      label: "QUESTION 3 OF 5",
      text: "Your biggest red flag is...",
      options: ["I reply to texts 3 days later", "I think running is a personality trait", "I'm way too attached to my Netflix list", "I talk to my plants"]
    },
    {
      label: "QUESTION 4 OF 5",
      text: "If you were a love language, which one?",
      options: ["Words of affirmation (and memes)", "Quality time (Netflix together, silence together)", "Gifts (mostly food)", "Physical touch but only for 5 minutes then I need space"]
    },
    {
      label: "QUESTION 5 OF 5",
      text: "Last question: why are you actually here?",
      options: ["Curiosity", "Tired of dating apps", "My friend told me to", "Science. Pure science."]
    }
  ];

  let currentQ = 0;

  // Photos live in the same folder as this HTML file.
  // NOTE: "meganfoxtransform..." was truncated in the screenshot — filename below
  // is a best guess (meganfoxtransform.png). If it doesn't load, rename the file
  // to match, or tell me the exact filename and I'll fix the reference.
  const matches = [
    { name: "7de Laan",        file: "7delaan.jpg",             tag: "97% Match", bio: "Been in the same storyline for 20 years and somehow still has drama left.", weight: 1 },
    { name: "Hand",            file: "hand.png",                tag: "82% Match", bio: "Strong, silent type. Mostly just a hand.", weight: 1 },
    { name: "Lucy Chen",       file: "lucychen.jpg",             tag: "93% Match", bio: "The algorithm is very confident about this one. We're not sure why.", weight: 1 },
    { name: "Mamma Coco",      file: "mammacoco.jpg",            tag: "88% Match", bio: "Warm, wise, and will absolutely feed you whether you're hungry or not.", weight: 1 },
    { name: "Marko",           file: "marko.png",                tag: "90% Match", bio: "Solid. Reliable. Slightly mysterious. Ten out of ten vibes.", weight: 3 },
    { name: "Megan Fox (Transformed)", file: "meganfoxtransformers.jpg", tag: "95% Match", bio: "High-maintenance in a very literal, possibly robotic sense.", weight: 1 },
    { name: "Morné",           file: "morne.png",                tag: "89% Match", bio: "Will win every argument, including the ones he started.", weight: 3 },
    { name: "Puss in Boots",   file: "pussinboots.jpg",          tag: "99% Match", bio: "Charming, dramatic, owns exactly one outfit and commits to it fully.", weight: 1 },
    { name: "René",            file: "rene.png",                tag: "91% Match", bio: "Mysteriously good at parking. Otherwise a complete wildcard.", weight: 3 },
    { name: "Sexy Shrek",      file: "sexyshrek.jpg",            tag: "100% Match", bio: "Green, swamp-dwelling, and weirdly the most confident option here.", weight: 1 },
    { name: "Shrek Dragon",    file: "shrekdragon.png",          tag: "96% Match", bio: "It's complicated. It's also on fire. Somehow it works.", weight: 1 },
    { name: "Shrek Witch",     file: "shrekwitch.jpg",           tag: "94% Match", bio: "Low-key terrifying, high-key iconic.", weight: 1 },
    { name: "Teresa Lisbon",   file: "teresalisbon.jpg",         tag: "92% Match", bio: "Will figure out you're lying before you've finished the sentence.", weight: 1 },
    { name: "Total Drama Island", file: "totaldrama island.jpg", tag: "87% Match", bio: "Chaotic, competitive, and somehow always ends in an explosion.", weight: 1 },
    { name: "Wednesday",       file: "wednesday.jpg",            tag: "98% Match", bio: "Will not smile for the photo. Will not smile for anything.", weight: 1 }
  ];

  function pickWeighted(list) {
    const totalWeight = list.reduce((sum, item) => sum + (item.weight || 1), 0);
    let roll = Math.random() * totalWeight;
    for (const item of list) {
      roll -= (item.weight || 1);
      if (roll <= 0) return item;
    }
    return list[list.length - 1];
  }

  function renderIntro() {
    screen.innerHTML = `
      <div class="intro">
        <div class="big-emoji">💘</div>
        <h2>Welcome to the Generator</h2>
        <p>Answer 5 deeply scientific questions and our algorithm (two if-statements and a dream) will calculate your perfect match.</p>
        <button class="start-btn" id="startBtn">Start the process</button>
      </div>
    `;
    document.getElementById('startBtn').addEventListener('click', () => {
      currentQ = 0;
      renderQuestion();
    });
  }

  function renderQuestion() {
    const q = questions[currentQ];
    const track = questions.map((_, i) => `<span class="${i < currentQ ? 'done' : ''}"></span>`).join('');
    screen.innerHTML = `
      <div class="progress-track">${track}</div>
      <div class="q-label">${q.label}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => `<button class="opt-btn" data-i="${i}">${opt}</button>`).join('')}
      </div>
    `;
    screen.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentQ++;
        if (currentQ < questions.length) {
          renderQuestion();
        } else {
          renderLoading();
        }
      });
    });
  }

  const loadingLines = [
    "Analyzing preferences...",
    "Scanning the multiverse...",
    "Negotiating with the universe's schedule...",
    "Recalibrating expectations...",
    "Finalizing result..."
  ];

  function renderLoading() {
    screen.innerHTML = `
      <div class="loading-wrap">
        <div class="big-emoji" style="font-size:2.2rem; margin-bottom:12px;">⚙️</div>
        <div class="lw-label" id="lwLabel">${loadingLines[0]}</div>
        <div class="bar-outer"><div class="bar-inner" id="barInner"></div></div>
        <div class="bar-pct" id="barPct">0%</div>
      </div>
    `;
    const bar = document.getElementById('barInner');
    const pct = document.getElementById('barPct');
    const label = document.getElementById('lwLabel');

    const durationMs = 5000;
    const stepMs = 50;
    let elapsed = 0;

    const timer = setInterval(() => {
      elapsed += stepMs;
      const pctVal = Math.min(100, Math.round((elapsed / durationMs) * 100));
      bar.style.width = pctVal + '%';
      pct.textContent = pctVal + '%';

      const lineIdx = Math.min(loadingLines.length - 1, Math.floor((elapsed / durationMs) * loadingLines.length));
      label.textContent = loadingLines[lineIdx];

      if (elapsed >= durationMs) {
        clearInterval(timer);
        renderResult();
      }
    }, stepMs);
  }

  function renderResult() {
    const isRoast = Math.random() < 0.35;
    if (isRoast) {
      renderRoast();
    } else {
      renderMatch();
    }
  }

  const roastLines = [
    "You wish you had one, don't you? 😏",
    "The algorithm looked at your answers and decided: not today, tiger.",
    "Error 404: Match not found. Try cleaning your room first.",
    "We found a perfect match. She decided not to show up.",
    "Result: you, alone, with this webpage. Romantic, actually.",
    "Based on your answers, we recommend a houseplant instead.",
    "Match found. Match immediately blocked your number.",
    "Our records show you already have someone. It's called standards. You lack them.",
    "Loading... loading... nope, still just you.",
    "You didn't pass the vibe check. The vibe check is very forgiving, too.",
    "Congratulations, you've unlocked: eternal singlehood.",
    "We asked around. Nobody's available. We didn't ask very hard.",
    "The algorithm needs more data. Specifically, it needs you to touch grass.",
    "Somewhere out there is your perfect match. It is not here.",
    "Scanning... scanning... yeah, we're going to go ahead and stop.",
    "You have been added to a waitlist. The waitlist is infinite.",
    "Good news: you saved money on a second dinner.",
    "The universe says 'not yet.' The universe is being polite.",
    "Compatibility calculated. Compatibility: N/A.",
    "We ran the numbers twice. Both times it just said 'lol.'",
    "Your perfect match exists. She's just extremely busy avoiding this.",
    "System overload: too much hope, not enough evidence.",
    "This app has commitment issues too. We understand each other.",
    "Try again tomorrow. Try again the day after that too, probably.",
    "You've reached the daily limit for main-character energy.",
    "Analysis complete: you peaked answering these questions.",
    "We matched you with someone. They matched with someone else instead.",
    "Your future girlfriend has been notified and has left the group chat.",
    "Statistically, this was always going to happen. Sorry.",
    "The good news is your search history stays private. The bad news is everything else.",
    "We'd introduce you to someone, but frankly we don't know anyone that brave.",
    "Update: still nobody. Update your expectations instead.",
    "This is less a rejection and more a gentle redirect. Toward being alone.",
    "You've been placed in the friend zone by an algorithm that's never met you.",
    "Processing complete. Conclusion: maybe try eye contact next time.",
    "Your match is currently in another app. That app also said no.",
    "We simulated 10,000 outcomes. You were single in all of them.",
    "Fun fact: this result has nothing to do with you. It's just funnier this way.",
    "The machine is not being mean. The machine is just built different.",
    "Query returned zero results. Have you tried being a Shrek character instead?",
    "This is what we in the industry call a 'character-building moment.'",
    "You get a participation trophy. It says 'Tried Their Best, Allegedly.'",
    "Nobody swiped right. Nobody swiped at all, actually.",
    "We checked the multiverse. You're single in most of them.",
    "Your aura has been read. It says 'buffering.'"
  ];

  function renderRoast() {
    const line = roastLines[Math.floor(Math.random() * roastLines.length)];
    screen.innerHTML = `
      <div class="roast">
        <div class="big-emoji">🙃</div>
        <h2>${line}</h2>
        <p>The good news: less toothpaste running out.</p>
        <button class="again-btn" id="againBtn">Try again</button>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', renderIntro);
  }

  function renderMatch() {
    const person = pickWeighted(matches);
    screen.innerHTML = `
      <div class="result-card">
        <div class="match-badge">${person.tag}</div>
        <div class="avatar-wrap"><img src="${encodeURI(person.file)}" alt="${person.name}" onerror="this.alt='(image not found: ${person.file})'; this.style.objectFit='contain';"></div>
        <div class="result-name">${person.name}</div>
        <div class="result-tag">Generated especially for you</div>
        <div class="result-bio">"${person.bio}"</div>
        <button class="again-btn" id="againBtn">Generate again</button>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', renderIntro);
  }

  renderIntro();
})();
</script>

</body>
</html>
